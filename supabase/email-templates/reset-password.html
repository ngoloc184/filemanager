<!-- Supabase Dashboard → Authentication → Emails → "Reset password".
     Subject: Your File Manager password reset code: {{ .Token }} -->
<div style="font-family:Inter,Segoe UI,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111827">
  <h2 style="margin:0 0 8px">Reset your password</h2>
  <p style="margin:0 0 16px;color:#4b5563">Enter this code on the “Forgot password” page, then choose a new password:</p>
  <p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:8px;font-family:Menlo,Consolas,monospace">{{ .Token }}</p>
  <p style="margin:0 0 16px;color:#6b7280;font-size:13px">If you did not ask to reset your password, ignore this e-mail — your password stays the same.</p>
  <p style="margin:0;color:#6b7280;font-size:13px">
    Or continue with this link:
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/forgot-password?step=password">reset my password</a>
  </p>
</div>
